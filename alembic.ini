# Alembic config for local development only (authoring new migrations).
#
# The gateway itself never reads this file -- it builds its Alembic Config
# in code (see mcp_gateway/db_migrations.py) so the database path can come
# from config.yaml/storage.path at runtime, and, for `:memory:` databases,
# so migrations run against the caller's own open connection rather than a
# fresh one opened from a path (see migrations/env.py).
#
# Point commands here at a scratch database with -x db-path=..., e.g.:
#   alembic -x db-path=/tmp/dev.db upgrade head
#   alembic -x db-path=/tmp/dev.db revision -m "describe the change"

[alembic]
script_location = src/mcp_gateway/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
