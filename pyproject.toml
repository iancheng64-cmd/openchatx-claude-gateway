[project]
name = "openchatx-claude-gateway"
version = "1.0.0"
description = "Spec-compliant OAuth 2.1 Remote MCP Gateway bridging OpenChatX local runtime to Anthropic Claude (Free / Pro / Team)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ian Cheng", email = "iancheng64@gmail.com" }
]
dependencies = [
    "fastmcp>=4.0.5,<5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.0",
    "bcrypt>=4.1.0",
    "itsdangerous>=2.1.0",
    "httpx>=0.27.0",
    "httpx2>=2.13.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.25",
]

[project.scripts]
openchatx-claude-gateway = "mcp_gateway.cli:main"
mcp-gateway = "mcp_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]
